<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Akku</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fceabb 30%, #f8b500 80%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card-container {
      width: 480px;
      height: 700px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s ease-in-out;
    }

    .card.opened {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 30px;
    }

    .front {
      background: #fff;
      justify-content: space-between;
    }

    .front h1 {
      font-family: 'Great Vibes', cursive;
      color: #f39c12;
      font-size: 58px;
      text-align: center;
      line-height: 1.4;
      margin-top: 80px;
    }

    .front h1 span {
      display: block;
    }

    .open-btn {
      font-size: 18px;
      font-style: italic;
      color: #d35400;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s;
      margin-top: 20px;
    }

    .open-btn:hover {
      color: #e67e22;
    }

    .back {
      background: #ffffff;
      transform: rotateY(180deg);
      justify-content: space-between;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      font-style: italic;
      font-size: 20px;
      color: #e67e22;
      line-height: 1.5;
    }

    .top-image {
      max-width: 180px;
      margin-bottom: 15px;
    }

    .birthday {
      max-width: 150px;
      margin-bottom: 20px;
    }

    @media (max-width: 500px) {
      .card-container {
        width: 90%;
        height: 80vh;
      }

      .front h1 {
        font-size: 48px;
      }

      .top-image {
        max-width: 120px;
      }

      .birthday {
        max-width: 110px;
      }
    }
  </style>
</head>
<body>

<div class="card-container">
  <div class="card" id="card">
    <!-- Front Face -->
    <div class="card-face front">
      <h1>
        <span>Happy</span>
        <span>Birthday</span>
        <span>Akku</span>
      </h1>
      <button class="open-btn" onclick="toggleCard()">Click to Open</button>
    </div>

    <!-- Back Face -->
    <div class="card-face back">
      <div class="content">
        <img class="top-image" src="akku.jpeg" alt="Top Image" />
        <img class="birthday" src="https://images.all-free-download.com/images/graphicthumb/best_happy_birthday_design_elements_vector_set_524004.jpg" alt="Birthday Sticker" />
      </div>
      <div class="content">
        Happiest Birthday, dear Akku!<br><br>
        Wishing you a year full of love, joy, and unforgettable moments.<br><br>
        I miss you so much here. Sending you lots and lots of love.<br><br>
      </div>
      <button class="open-btn" onclick="toggleCard()">Back to Front</button>
    </div>
  </div>
</div>

<script>
  function toggleCard() {
    document.getElementById('card').classList.toggle('opened');
  }
</script>

</body>
</html>
