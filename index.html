<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday</title>
  <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Tangerine:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: #fdfdfd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Tangerine', cursive;
      perspective: 1200px;
    }

    input {
      display: none;
    }

    .card {
      width: 90vw;
      max-width: 350px;
      height: 80vh;
      max-height: 500px;
      border: 1px solid #eee;
      position: absolute;
      box-shadow: 5px 5px 15px 0 #ddd;
      background-color: #fff;
      background-size: cover;
      background-position: center;
      transform-origin: 0% 50%;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: transform 1s;
    }

    .pg1 {
      z-index: 40;
      background-image: url("https://assets.stickpng.com/thumbs/580b585b2edbce24c47b26dd.png");
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .pg1 .title {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 60px;
    }

    .pg1 .h, .pg1 .bd, .pg1 .ak {
      background: linear-gradient(
        -45deg,
        rgba(15, 59, 95, .6) 25%,
        rgba(15, 59, 95, 1) 25%,
        rgba(15, 59, 95, 1) 50%,
        rgba(15, 59, 95, .6) 50%,
        rgba(15, 59, 95, .6) 75%,
        rgba(15, 59, 95, 1) 75%,
        rgba(15, 59, 95, 1)
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-weight: bold;
    }

    .pg1 .h {
      font-size: clamp(2rem, 8vw, 6rem);
    }

    .pg1 .bd {
      font-size: clamp(1.5rem, 6vw, 5rem);
    }

    .pg1 .ak {
      font-size: clamp(1.5rem, 6vw, 5rem);
    }

    .pg1 .click {
      margin-top: auto;
      padding-bottom: 20px;
      font-size: clamp(1rem, 4vw, 2rem);
      color: #444;
    }

    .pg2 {
      z-index: 30;
      transform: rotateY(180deg);
    }

    .pg2 .content {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .pg2 .top-image {
      max-width: 80%;
      height: auto;
      display: block;
      margin: 30px auto 0 auto;
      border-radius: 10px;
    }

    .pg2 .birthday {
      max-width: 90%;
      height: auto;
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
    }

    .pg3 {
      z-index: 20;
      transform: rotateY(180deg);
    }

    .pg3 .content {
      padding: 60px 20px;
      font-size: clamp(1rem, 3.5vw, 2rem);
      font-weight: bold;
      color: rgba(212, 25, 25, 0.85);
      height: 100%;
      overflow-y: auto;
      text-align: center;
    }

    #open:checked ~ .pg1 {
      animation: openCardPg1 1s ease forwards;
    }

    #open:checked ~ .pg2 {
      animation: openCardPg2 1s ease forwards;
    }

    @keyframes openCardPg1 {
      50% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(-180deg);
      }
    }

    @keyframes openCardPg2 {
      49% {
        z-index: 30;
      }
      50% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(-180deg);
        z-index: 50;
      }
    }

    @media (max-width: 400px) {
      .pg1 .title {
        margin-top: 30px;
      }

      .pg3 .content {
        padding: 20px 15px;
        font-size: 1rem;
      }

      .pg2 .birthday {
        max-width: 80%;
        top: 75%;
      }
    }
  </style>
</head>
<body>
  <input id="open" type="checkbox" />
  <label for="open" class="card pg1">
    <div class="title">
      <div class="h">Happy</div>
      <div class="bd">Birthday</div>
      <div class="ak">Akku</div>
    </div>
    <div class="click">Click To Open</div>
  </label>

  <div class="card pg2">
    <div class="content">
      <img class="top-image" src="akku.jpeg" alt="Top Decoration" />
      <img class="birthday" src="https://images.all-free-download.com/images/graphicthumb/best_happy_birthday_design_elements_vector_set_524004.jpg" alt="Birthday Art" />
    </div>
  </div>

  <div class="card pg3">
    <div class="content">
      Happiest Birthday, dear Akkuse!<br><br>
      Wishing you a year full of giggles, games, and all the happiness in the world.<br><br>
      I miss you so much here. Lots and lots of love.<br><br>
      — Mokku
    </div>
  </div>
</body>
</html>
